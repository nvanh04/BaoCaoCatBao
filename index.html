    LocalDB.set('me_cache', S.me);
    LocalDB.handle('POST', '/api/device', { id, name, machine });
    workerHome();
    api('POST', '/api/device', { id, name, machine }).catch(() => {});
  },
  stafflogin: () => staffLoginModal(),
  help: () => helpModal(),
  newrep: () => newRepModal(),
  open: b => openReport(+b.dataset.id),
  pickplan: () => pickPlanItemModal(),
  editme: () => {
    const ms = (S.config.machines && S.config.machines.length) ? S.config.machines : DEFAULT_OLD_MACHINES;
    const m = modal(`<h3>Thông tin của tôi</h3><label class="f"><span>Họ và tên (C01)</span><input id="en" type="text" value="${esc(S.me.name)}"></label>
    <label class="f" style="margin-top:10px"><span>Máy cắt hay làm (Cột A)</span><select id="em">${ms.map(x => `<option ${x === S.me.last_machine ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
    <div class="row end"><button class="btn" data-close>Hủy</button><button class="btn pri" id="ego">Lưu</button></div>
    <p style="margin-top:14px"><a href="#" id="esl">Đăng nhập Quản lý ca / Admin</a></p>`);
    $('#esl', m).onclick = ev => { ev.preventDefault(); m.remove(); staffLoginModal(); };
    $('#ego', m).onclick = async () => {
      const name = $('#en', m).value.trim();
      const machine = $('#em', m).value;
      if (!name) { toast('Họ tên không được để trống', 'bad'); return; }
      localStorage.setItem('cb_dev_name', name);
      localStorage.setItem('cb_dev_machine', machine);
      S.me.name = name; S.me.last_machine = machine;
      LocalDB.set('me_cache', S.me);
      LocalDB.handle('PUT', '/api/device', { name, machine });
      m.remove();
      workerHome();
      api('PUT', '/api/device', { name, machine }).catch(() => {});
    };
  },
  back: () => leaveEditor(),
  save: () => save(false),
  submit: () => submitReport(),
  head: () => { S.headOpen = !S.headOpen; renderEditor(); },
  prod: b => { S.pid = +b.dataset.i; S.step = 1; S.lan = 0; renderEditor(); },
  addprod: () => {
    prods().push(newProduct());
    S.pid = prods().length - 1;
    S.step = 1; S.lan = 0;
    markDirty();
    renderEditor();
    window.scrollTo(0, 0);
  },
  copysp3: b => {
    const pIdx = +b.dataset.i;
    if (pIdx <= 0) return;
    const prev = prods()[pIdx - 1], curr = prods()[pIdx];
    ['toc_do_cat', 'toc_do_may', 'tg_dao_cat_chi', 'tg_phong_pe', 'tg_han_pe', 'tg_rut_pe', 'kc_2_bao', 'nhiet_cat_bao', 'nhiet_cat_chi', 'nhiet_han_pe'].forEach(k => { curr[k] = prev[k]; });
    markDirty();
    renderStepBody();
    toast('Đã sao chép thông số máy từ đơn trước ✓', 'ok');
  },
  delprod: async () => {
    if (!await ask('Xóa sản phẩm?', `Xóa toàn bộ dữ liệu của <b>sản phẩm ${S.pid + 1}</b> khỏi phiếu này?`, 'Xóa', true)) return;
    prods().splice(S.pid, 1);
    S.pid = Math.max(0, S.pid - 1);
    markDirty();
    renderEditor();
  },
  step: b => { S.step = +b.dataset.n; renderStepBody(); window.scrollTo({ top: 0 }); },
  addroll: () => {
    const p = prods()[S.pid];
    const r = newRoll();
    if (p.rolls.length) {
      if (p.rolls[0].ma_kh) r.ma_kh = p.rolls[0].ma_kh;
      if (p.rolls[0].ma_pe) r.ma_pe = p.rolls[0].ma_pe;
      if (p.rolls[0].dai_cat) r.dai_cat = p.rolls[0].dai_cat;
    }
    p.rolls.push(r);
    S.rollOpen[r.id] = true;
    markDirty();
    renderStepBody();
  },
  delroll: async b => {
    if (!await ask('Xóa cuộn?', 'Xóa thẻ cuộn này?', 'Xóa', true)) return;
    const p = prods()[S.pid];
    p.rolls.splice(+b.dataset.i, 1);
    recalcTotal(S.pid);
    markDirty();
    renderStepBody();
  },
  togroll: b => {
    const id = b.dataset.id, p = prods()[S.pid], last = p.rolls[p.rolls.length - 1].id;
    const isOpen = !(S.rollOpen[id] ?? (id === last));
    S.rollOpen[id] = isOpen;
    // Cập nhật trực tiếp trên DOM, không vẽ lại cả trang giúp mượt 0ms trên điện thoại
    const card = b.closest('.roll');
    if (card) {
      const rb = card.querySelector('.rb');
      const arr = card.querySelector('.roll-arr');
      if (rb) rb.classList.toggle('hide', !isOpen);
      if (arr) arr.textContent = isOpen ? '▲' : '▼';
    }
  },
  seg: async b => {
    const p = b.dataset.p;
    let v = b.dataset.v;
    const cur = getPath(S.rep, p);
    if (b.dataset.tog && cur === v) v = '';
    setPath(S.rep, p, v);
    if (b.dataset.re) {
      markDirty();
      await syncPlanAfterHeaderChange();
      return;
    }
    $$(`[data-act="seg"][data-p="${p}"]`).forEach(x => x.classList.toggle('on', x.dataset.v === v && v !== ''));
    markDirty();
    if (S.step === 4) refreshLanLabels();
  },
  tog: b => {
    const p = b.dataset.p;
    const v = !getPath(S.rep, p);
    setPath(S.rep, p, v);
    b.classList.toggle('on', v);
    b.textContent = (v ? '✓ ' : '') + b.textContent.replace('✓ ', '');
    markDirty();
  },
  now: b => {
    const p = b.dataset.p;
    const v = nowHM();
    setPath(S.rep, p, v);
    const el = b.parentElement.querySelector('input');
    if (el) el.value = v;
    markDirty();
    refreshStepTabs();
    if (S.step === 4) refreshLanLabels();
  },
  lan: b => {
    S.lan = +b.dataset.i;
    if (S.qcAllCols) {
      S.qcAllCols = false;
      $('#pbody')?.classList.remove('qc-all-cols');
      const togBtn = $('.lanbar [data-act="togqcall"]');
      if (togBtn) {
        togBtn.classList.remove('on');
        togBtn.textContent = `👁 Xem tất cả (${prods()[S.pid].qc.lans.length} lần)`;
      }
    }
    $$('.lantabs .chip[data-act="lan"]').forEach((c, i) => c.classList.toggle('on', i === S.lan));
    $$('#pbody .qrow').forEach(row => {
      $$('.qcell', row).forEach((cell, i) => cell.classList.toggle('cur', i === S.lan));
    });
  },
  togqcall: b => {
    S.qcAllCols = !S.qcAllCols;
    $('#pbody')?.classList.toggle('qc-all-cols', S.qcAllCols);
    b.classList.toggle('on', S.qcAllCols);
    const n = prods()[S.pid].qc.lans.length;
    b.textContent = S.qcAllCols ? '👁 Xem từng lần' : `👁 Xem tất cả (${n} lần)`;
    $$('.lantabs .chip[data-act="lan"]').forEach((c, i) => c.classList.toggle('on', !S.qcAllCols && i === S.lan));
  },
  addlan: () => {
    const q = prods()[S.pid].qc;
    q.lans.push({ v: {} });
    S.lan = q.lans.length - 1;
    markDirty();
    keepScroll(() => renderStepBody());
  },
  dellan: async b => {
    if (!await ask('Xóa lần kiểm tra?', 'Xóa toàn bộ kết quả của lần này?', 'Xóa', true)) return;
    const q = prods()[S.pid].qc;
    q.lans.splice(+b.dataset.i, 1);
    S.lan = 0;
    markDirty();
    keepScroll(() => renderStepBody());
  },
  allok: b => {
    const lIdx = +b.dataset.i;
    const l = prods()[S.pid].qc.lans[lIdx];
    if (!l.v.tg) l.v.tg = nowHM();
    OK_ITEMS.forEach(i => { if (!l.v[i.k]) l.v[i.k] = 'ok'; });
    // Cập nhật trực tiếp trên DOM mà không cần vẽ lại toàn bộ cây HTML
    const tgInput = $(`input[data-p="data.products.${S.pid}.qc.lans.${lIdx}.v.tg"]`);
    if (tgInput) tgInput.value = l.v.tg;
    OK_ITEMS.forEach(i => {

  approve: async () => {
    if (S.dirty) await save(false);

    localStorage.removeItem('bk_' + S.rep.id);
    toast('Đã duyệt ✓', 'ok');
    staffHome();

    localStorage.removeItem('bk_' + S.rep.id);
    S.dirty = false;
    toast('Đã xóa', 'ok');
    staffHome();
  },
  tab: b => { S.tab = b.dataset.t; staffHome(); },
  refresh: () => staffHome(false, true),
  filter: () => { S.f = { from: $('#ff').value, to: $('#ft').value, shift: $('#fs').value, machine: $('#fm').value, status: defVal($('#fst')?.value, '') }; staffHome(false, true); },
  logout: async () => { staffLogoutLocal(); S.me = null; welcome(); api('POST', '/api/logout').catch(() => {}); },
  chpw: () => pwModal(),
  export: () => doExport(),
  saveplan: async b => {
    if (!S.parsedPlan) { toast('Vui lòng chọn file Excel kế hoạch trước', 'bad'); return; }
    const planDate = $('#pl_date').value;
    const shift = $('#pl_shift').value;
    const syncMach = $('#pl_sync_mach')?.checked;
    if (!planDate || !shift) { toast('Vui lòng chọn Ngày và Ca áp dụng kế hoạch', 'bad'); return; }
    b.disabled = true; b.textContent = '⏳ Đang lưu kế hoạch…';
    try {
      const payload = {
        plan_date: planDate,
        shift: shift,
        items: S.parsedPlan.itemsByMachine,
        sync_machines: syncMach ? S.parsedPlan.machines : null
      };
      await api('POST', '/api/plans', payload);
      if (syncMach && S.parsedPlan.machines.length) {
        S.config.machines = S.parsedPlan.machines;
        LocalDB.set('settings', { machines: S.config.machines, shifts: S.config.shifts });
      }
      S.parsedPlan = null;
      toast(`Đã lưu kế hoạch cho Ngày ${fd(planDate)} · Ca ${shift} ✓`, 'ok');
      plansView(true);
    } catch (e) {
      b.disabled = false; b.textContent = '💾 Lưu & Áp dụng Kế hoạch';
      toast(e.message, 'bad');
    }
  },
  viewplan: b => {
    const key = b.dataset.key;

    const pl = plans[key] || (S.cache.plans || []).find(x => `${x.plan_date}_${x.shift}` === key);
    if (!pl || !pl.items) { toast('Không tìm thấy chi tiết kế hoạch', 'bad'); return; }
    const entries = Object.entries(pl.items).filter(([, arr]) => arr && arr.length > 0);
    modal(`<h3>Chi tiết Kế hoạch: Ngày ${fd(pl.plan_date)} · Ca ${esc(pl.shift)}</h3>
      <p class="small mut">Tổng cộng ${entries.length} máy có lệnh sản xuất:</p>
      <div style="max-height:60vh;overflow:auto">${entries.map(([mach, arr]) => `<div class="card" style="padding:10px;margin-bottom:8px">
        <b>Máy ${esc(mach)} (${arr.length} đơn)</b>
        <ul style="margin:6px 0 0;padding-left:18px" class="small">${arr.map(it => `<li>ĐH: <b>${esc(it.ma_dh)}</b> · KH: <b>${esc(it.ma_kh)}</b> · SP: <b>${esc(it.ma_sp)}</b> ${it.sl_ke_hoach ? `(${fmtN(it.sl_ke_hoach)} cái)` : ''}</li>`).join('')}</ul>
      </div>`).join('')}</div>
      <div class="row end"><button class="btn pri" data-close>Đóng</button></div>`, true);
  },
  delplan: async b => {
    const d = b.dataset.date, s = b.dataset.shift;
    if (!await ask('Xóa kế hoạch?', `Xóa kế hoạch Ngày ${fd(d)} · Ca ${esc(s)}?`, 'Xóa', true)) return;
    await api('DELETE', `/api/plans?date=${encodeURIComponent(d)}&shift=${encodeURIComponent(s)}`);
    toast('Đã xóa kế hoạch', 'ok');
    plansView(true);
  },
  useradd: () => userModal(),
  useredit: b => userModal(+b.dataset.id),
  devrename: async b => {
    const n = await askText('Đổi tên thiết bị', 'Tên công nhân', 'Lưu');
    if (n === null || !n.trim()) return;
    await api('PUT', '/api/devices/' + b.dataset.id, { name: n.trim() });
    S.cache.devices = null;
    devicesView(true);
  },
  devdel: async b => {
    if (!await ask('Xóa thiết bị?', 'Xóa thiết bị chưa có phiếu này?', 'Xóa', true)) return;
    await api('DELETE', '/api/devices/' + b.dataset.id);
    S.cache.devices = null;
    devicesView(true);
  },
  savesettings: async () => {
    const machines = $('#sm').value.split('\n').map(x => x.trim()).filter(Boolean);
    const shifts = $('#ss').value.split('\n').map(x => x.trim()).filter(Boolean).map(x => {
      const [c, ...n] = x.split(PIPE);
      const joined = n.join(PIPE);
      return { code: c.trim(), name: defVal(joined, c).trim() };
    });
    if (!machines.length || shifts.length < 2) {
      toast('Cần tối thiểu 1 máy và 2 ca làm việc', 'bad');
      return;

    S.config.shifts = shifts;
    LocalDB.set('settings', { machines, shifts });

    await api('PUT', '/api/settings', { machines, shifts });

function defFilters() {
  const now = new Date();
  const past = new Date(now.getTime() - 7 * 86400000);
  return { from: ymd(past), to: ymd(now), shift: '', machine: '', status: '' };
}

function staffShell(inner, tab) {
  const adm = isAdmin();
  const tabs = [
    ['pending', 'Chờ duyệt' + (S.me.pending ? `<span class="cnt" id="pend_cnt">${S.me.pending}</span>` : '<span class="cnt hide" id="pend_cnt">0</span>')],
    ['all', 'Tất cả phiếu'],
    ['plans', '📅 Kế hoạch SX']
  ];
  if (adm) tabs.push(['export', '📥 Xuất Excel'], ['users', 'Tài khoản'], ['devices', 'Thiết bị'], ['settings', 'Cài đặt']);
  app.innerHTML = `<div class="top"><h1>Báo cáo cắt bao<span class="sub">${adm ? 'Admin tổng' : 'Quản lý ca'}: ${esc(S.me.name)}</span></h1><button data-act="chpw">🔑</button><button data-act="logout">Đăng xuất</button></div>
  <div class="wrap wide"><div class="nav">${tabs.map(([t, l]) => `<button class="${tab === t ? 'on' : ''}" data-act="tab" data-t="${t}">${l}</button>`).join('')}<button data-act="refresh" title="Làm mới dữ liệu">↻</button></div>${inner}</div>`;
}

async function staffHome(fromBoot = false, forceRefresh = false) {
  S.view = 'staff'; S.rep = null; clearTimeout(window._rf);
  if (!S.me || S.me.kind !== 'staff') {
    staffLogoutLocal();
    return boot();
  }
  const t = S.tab;
  if (t === 'plans') return plansView(forceRefresh);
  if (t === 'export' && isAdmin()) return exportView();
  if (t === 'users' && isAdmin()) return usersView(forceRefresh);
  if (t === 'devices' && isAdmin()) return devicesView(forceRefresh);
  if (t === 'settings' && isAdmin()) return settingsView();

  const f = S.f ? S.f : (S.f = defFilters());
  const q = new URLSearchParams();
  if (t === 'pending') { q.set('status', 'submitted'); }
  else { ['from', 'to', 'shift', 'machine', 'status'].forEach(k => f[k] && q.set(k, f[k])); }
  const qStr = q.toString();

  const filt = t === 'pending' ? '' : `<div class="card"><div class="filters">
    <label class="f"><span>Từ ngày</span><input type="date" id="ff" value="${f.from}"></label><label class="f"><span>Đến ngày</span><input type="date" id="ft" value="${f.to}"></label>
    <label class="f"><span>Ca</span><select id="fs"><option value="">Tất cả</option>${S.config.shifts.map(s => `<option value="${esc(s.code)}" ${f.shift === s.code ? 'selected' : ''}>${esc(s.name)} (${esc(s.code)})</option>`).join('')}</select></label>
    <label class="f"><span>Máy</span><select id="fm"><option value="">Tất cả</option>${S.config.machines.map(m => `<option ${f.machine === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select></label>
    <label class="f"><span>Trạng thái</span><select id="fst"><option value="">Tất cả</option>${Object.entries(STAT).map(([k, v]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <button class="btn pri" data-act="filter">Lọc</button></div></div>`;

  staffShell(filt + '<div id="lst"><p class="mut">Đang tải…</p></div>', t);

  const localFiltered = LocalDB.handle('GET', '/api/reports?' + qStr).reports;
  if (localFiltered && (localFiltered.length || S.cache.reports[qStr])) {
    renderStaffReportTable(S.cache.reports[qStr] || localFiltered, t);
  }

  try {
    const r = await api('GET', '/api/reports?' + qStr);
    S.cache.reports[qStr] = r.reports || [];
    if (r.pending !== undefined) {
      S.me.pending = r.pending;
      const cntEl = $('#pend_cnt');
      if (cntEl) {
        cntEl.textContent = r.pending;
        cntEl.classList.toggle('hide', !r.pending);
      }
    }
    if (S.view === 'staff' && S.tab === t) {
      renderStaffReportTable(S.cache.reports[qStr], t);
    }
    window._rf = setTimeout(() => { if (S.view === 'staff' && (S.tab === 'pending' || S.tab === 'all')) staffHome(); }, 60000);
  } catch (e) {
    if (!localFiltered || !localFiltered.length) $('#lst').innerHTML = `<div class="note bad">${esc(e.message)}</div>`;
  }
}

async function doExport() {
  const btn = $('#xbtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Đang tổng hợp dữ liệu…'; }
  try {
    const q = new URLSearchParams({ full: '1', from: $('#xf').value, to: $('#xt').value, shift: $('#xs').value, machine: $('#xm').value, status: $('#xst').value });
    S.ef = { from: $('#xf').value, to: $('#xt').value };
    const r = await api('GET', '/api/reports?' + q);
    const list = defVal(r.reports, []);
    const fullReports = list.length && list[0].data !== undefined
      ? list
      : await Promise.all(list.map(x => api('GET', '/api/reports/' + x.id)));

    const rows1 = [], rows2 = [];
    fullReports.forEach(rep => {
      const [yy, mm, dd] = defVal(rep.report_date, '').split('-').map(Number);
      const dt = yy ? new Date(Date.UTC(yy, mm - 1, dd)) : rep.report_date;
      const plist = (rep.data && rep.data.products) ? rep.data.products : [];
      plist.forEach(p => {
        const tot = toInt(p.tong_cai) || (p.rolls || []).reduce((a, ro) => a + toInt(ro.so_cai), 0);
        let ng = 0;
        ((p.qc && p.qc.lans) ? p.qc.lans : []).forEach(l => Object.values(defVal(l.v, {})).forEach(v => { if (v === 'ng') ng++; }));
        const nProd = (k, int = false) => int ? toIntOpt(p[k]) : (toNum(p[k]) ?? defVal(p[k], ''));
        rows1.push([
          rep.machine, dt, rep.shift, defVal(p.ma_dh, ''), defVal(p.ma_sp, ''),
          defVal(p.c01_id, ''), defVal(p.c01_name, ''),
          defVal(p.c02_id, ''), defVal(p.c02_name, ''),
          defVal(p.c03_id, ''), defVal(p.c03_name, ''),
          defVal(p.c04_id, ''), defVal(p.c04_name, ''),
          tot, fmtTimeSAP(p.bat_dau), fmtTimeSAP(p.ket_thuc),
          nProd('dung_thay_cuon', true), nProd('dung_doi_hang', true), nProd('dung_may_hu', true), nProd('dung_cho_hang', true), nProd('dung_khac', true), defVal(p.dung_khac_ly_do, ''),
          nProd('toc_do_cat'), nProd('toc_do_may'), nProd('tg_dao_cat_chi'), nProd('tg_phong_pe'), nProd('tg_han_pe'), nProd('tg_rut_pe'), nProd('kc_2_bao'),
          nProd('nhiet_cat_bao'), nProd('nhiet_cat_chi'), nProd('nhiet_han_pe'),
          rep.worker_name, defVal(STAT[rep.status], rep.status), defVal(rep.approved_by, ''), ng
        ]);
        defVal(p.rolls, []).forEach(ro => {
          const hasData = Object.entries(ro).some(([k, v]) => !['id', 'ql_xn', 'ql_xn_by'].includes(k) && String(defVal(v, '')).trim() !== '');
          if (!hasData) return;
          const n = (k, int = false) => int ? toIntOpt(ro[k]) : (toNum(ro[k]) ?? defVal(ro[k], ''));
          rows2.push([
            rep.machine, dt, rep.shift, defVal(p.ma_dh, ''), defVal(p.ma_sp, ''), defVal(ro.ma_kh, ''), defVal(ro.cuon_so_may_so, ''), defVal(ro.ca_ngay_sx, ''), n('kg_dau_cuon'),
            defVal(ro.ma_pe, ''), defVal(ro.cuon_pe, ''), defVal(ro.ca_ngay_thoi, ''), n('kho_bao'), n('dai_cat'), n('dl10'), n('so_cai', true),
            n('phe_co_dau'), n('phe_khong_dau', true), n('rau_bo', true), n('rau_dem', true), ro.ql_xn ? 'Có' : '', rep.worker_name
          ]);
        });
      });
    });
    const h1 = ['Máy', 'Ngày', 'Ca', 'Mã đơn hàng', 'Mã sản phẩm', 'Mã C01', 'Tên C01', 'Mã C02', 'Tên C02', 'Mã C03', 'Tên C03', 'Mã C04', 'Tên C04', 'Số cái cắt được', 'Giờ bắt đầu', 'Giờ kết thúc', 'Dừng: thay cuộn', 'Dừng: đổi hàng', 'Dừng: máy hư', 'Dừng: chờ hàng', 'Dừng: khác', 'Lý do khác', 'Tốc độ cắt', 'Tốc độ may', 'TG dao cắt chỉ', 'TG phóng PE', 'TG hàn PE', 'TG rút PE', 'Khoảng cách 2 bao', 'Nhiệt cắt bao', 'Nhiệt cắt chỉ', 'Nhiệt hàn PE', 'Người nhập', 'Trạng thái phiếu', 'Quản lý duyệt', 'Số mục KT lỗi'];
    const h2 = ['Máy', 'Ngày', 'Ca', 'Mã đơn hàng', 'Mã sản phẩm', 'Mã KH', 'Cuộn số / Máy số', 'Ca & ngày sản xuất', 'Số kg/mét đầu cuộn', 'Mã PE', 'Cuộn số / Máy thổi', 'Ca, ngày thổi', 'Khổ bao (cm)', 'Chiều dài cắt sau may (cm)', 'ĐL 10 cái đầu cuộn (g)', 'Số cái cắt được', 'Phế liệu có đánh dấu (kg)', 'Phế liệu không đánh dấu (cái)', 'Râu bỏ', 'Râu đếm', 'QL xác nhận cắt hàng loạt', 'Người nhập'];
    const blob = buildXlsxBlob([
      { name: 'Sản lượng cắt bao', headers: h1, rows: rows1, widths: [10, 12, 8, 18, 18, 10, 16, 10, 16, 10, 16, 10, 16, 14, 12, 12, 11, 11, 11, 11, 11, 16, 11, 11, 13, 13, 13, 13, 14, 13, 13, 13, 16, 14, 20, 14] },
      { name: 'Chi tiết cuộn', headers: h2, rows: rows2, widths: [10, 12, 8, 16, 16, 12, 14, 14, 12, 12, 14, 14, 11, 13, 13, 13, 13, 13, 9, 9, 13, 16] }
    ]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `San_luong_cat_bao_${ymd().replace(/-/g, '')}.xlsx`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Đã tải file Excel ✓', 'ok');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📥 Tải file Excel (.xlsx)'; }
  }
}

function renderUsersList(users) {
  const el = $('#lst');
  if (!el) return;
  window._users = users;
  el.innerHTML = `<div class="card"><div class="row"><h3 class="sp">Tài khoản quản lý</h3><button class="btn pri" data-act="useradd">＋ Thêm tài khoản</button></div>
  <p class="small mut">Công nhân <b>không cần tài khoản</b> – mỗi điện thoại tự đăng ký tên lần đầu.</p></div>
  <table class="rt"><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${users.map(u => `<tr><td data-l="Tên đăng nhập"><b>${esc(u.username)}</b></td><td data-l="Họ tên">${esc(u.full_name)}</td><td data-l="Vai trò">${u.role === 'admin' ? 'Admin tổng' : 'Quản lý ca'}</td><td data-l="Trạng thái">${u.active ? '<span class="badge b-approved">Hoạt động</span>' : '<span class="badge b-draft">Đã khóa</span>'}</td><td class="act-cell"><button class="btn sm" data-act="useredit" data-id="${u.id}">✎ Sửa</button></td></tr>`).join('')}</tbody></table>`;
}

async function usersView(force = false) {
  staffShell('<div id="lst"><p class="mut">Đang tải…</p></div>', 'users');
  const cached = S.cache.users || LocalDB.get('users', null);
  if (cached) renderUsersList(cached);
  if (S.cache.users && !force) return;
  try {
    const r = await api('GET', '/api/users');
    if (r && Array.isArray(r.users)) {
      S.cache.users = r.users;
      if (S.view === 'staff' && S.tab === 'users') renderUsersList(r.users);
    }
  } catch (e) { toast(e.message, 'bad'); }
}

function userModal(id) {
  const u = id ? (window._users || []).find(x => Number(x.id) === Number(id)) : null;
  const m = modal(`<h3>${u ? 'Sửa tài khoản' : 'Thêm tài khoản'}</h3>
  <label class="f"><span>Tên đăng nhập (chữ thường, không dấu)</span><input id="uu" type="text" autocapitalize="none" value="${u ? esc(u.username) : ''}" ${u ? 'disabled' : ''}></label>
  <label class="f" style="margin-top:8px"><span>Họ tên</span><input id="un" type="text" value="${u ? esc(u.full_name) : ''}"></label>
  <label class="f" style="margin-top:8px"><span>Vai trò</span><select id="ur"><option value="manager" ${u && u.role === 'manager' ? 'selected' : ''}>Quản lý ca (xem, duyệt, trả lại, up kế hoạch)</option><option value="admin" ${u && u.role === 'admin' ? 'selected' : ''}>Admin tổng (toàn quyền, xuất Excel)</option></select></label>
  <label class="f" style="margin-top:8px"><span>${u ? 'Mật khẩu mới (bỏ trống nếu không đổi)' : 'Mật khẩu (tối thiểu 6 ký tự)'}</span><input id="up" type="text" autocomplete="off"></label>
  ${u ? `<label class="f" style="margin-top:8px"><span>Trạng thái</span><select id="ua"><option value="1" ${u.active ? 'selected' : ''}>Hoạt động</option><option value="0" ${u.active ? '' : 'selected'}>Khóa tài khoản</option></select></label>` : ''}
  <div class="row end"><button class="btn" data-close>Hủy</button><button class="btn pri" id="ugo">Lưu</button></div>`);
  $('#ugo', m).onclick = async () => {
    try {
      if (u) {
        const b = { full_name: $('#un', m).value, role: $('#ur', m).value, active: +$('#ua', m).value };
        if ($('#up', m).value) b.password = $('#up', m).value;
        await api('PUT', '/api/users/' + u.id, b);
      } else {
        await api('POST', '/api/users', { username: $('#uu', m).value, full_name: $('#un', m).value, role: $('#ur', m).value, password: $('#up', m).value });
      }
      m.remove();
      S.cache.users = null;
      usersView(true);
      toast('Đã lưu', 'ok');
    } catch (e) { toast(e.message, 'bad'); }
  };
}

function pwModal() {
  const m = modal(`<h3>Đổi mật khẩu</h3><label class="f"><span>Mật khẩu hiện tại</span><input id="p0" type="password"></label>
  <label class="f" style="margin-top:8px"><span>Mật khẩu mới (tối thiểu 6 ký tự)</span><input id="p1" type="password"></label>
  <div class="row end"><button class="btn" data-close>Hủy</button><button class="btn pri" id="pgo">Đổi</button></div>`);
  $('#pgo', m).onclick = async () => {
    try {
      await api('POST', '/api/password', { old: $('#p0', m).value, new: $('#p1', m).value });
      m.remove();
      toast('Đã đổi mật khẩu', 'ok');
    } catch (e) { toast(e.message, 'bad'); }
  };
}

function renderDevicesList(devices) {
  const el = $('#lst');
  if (!el) return;
  const rows = (devices || []).map(d => `<tr><td data-l="Tên công nhân"><b>${esc(d.name)}</b></td><td data-l="Máy hay làm">${esc(defVal(d.last_machine, '—'))}</td><td class="num" data-l="Số phiếu">${defVal(d.n_reports, 0)}</td><td data-l="Dùng gần nhất">${esc(toVNDisplay(d.last_seen).full)}</td>
  <td class="act-cell"><button class="btn sm" data-act="devrename" data-id="${d.id}">✎ Đổi tên</button> ${d.n_reports ? '' : `<button class="btn sm bad" data-act="devdel" data-id="${d.id}">🗑 Xóa</button>`}</td></tr>`).join('');
  el.innerHTML = `<div class="card"><h3>Thiết bị công nhân</h3><p class="small mut">Mỗi điện thoại/trình duyệt là 1 thiết bị.</p></div>
  <table class="rt"><thead><tr><th>Tên</th><th>Máy hay làm</th><th class="num">Số phiếu</th><th>Dùng gần nhất</th><th>Thao tác</th></tr></thead><tbody>${defVal(rows, '<tr><td colspan="5" class="empty-cell mut">Chưa có thiết bị nào.</td></tr>')}</tbody></table>`;
}

async function devicesView(force = false) {
  staffShell('<div id="lst"><p class="mut">Đang tải…</p></div>', 'devices');
  if (S.cache.devices) renderDevicesList(S.cache.devices);
  if (S.cache.devices && !force) return;
  try {
    const r = await api('GET', '/api/devices');
    if (r && Array.isArray(r.devices)) {
      S.cache.devices = r.devices;
      if (S.view === 'staff' && S.tab === 'devices') renderDevicesList(r.devices);
    }
  } catch (e) { toast(e.message, 'bad'); }
}

function settingsView() {
  const sheetLink = S.config.sheet_url ? `<div class="note info small" style="margin-bottom:12px">📊 File Google Sheets lưu trữ dữ liệu: <a href="${esc(S.config.sheet_url)}" target="_blank"><b>Mở bảng dữ liệu Google Sheets ↗</b></a></div>` : '';
  staffShell(`<div class="card" style="max-width:720px"><h3>Cài đặt</h3>
  ${sheetLink}
  <label class="f"><span>Danh sách máy cắt (Mã máy cũ Cột A – mỗi dòng 1 máy)</span><textarea id="sm" style="min-height:160px">${esc(S.config.machines.join('\n'))}</textarea></label>
  <label class="f" style="margin-top:10px"><span>Các ca (mỗi dòng: MÃ|Tên ca). Dòng 1 = ca ngày (07h–19h), dòng 2 = ca đêm (19h–07h)</span><textarea id="ss">${esc(S.config.shifts.map(s => s.code + PIPE + s.name).join('\n'))}</textarea></label>
  <button class="btn pri" style="margin-top:12px" data-act="savesettings">Lưu cài đặt</button></div>`, 'settings');
}

boot();
</script>
</body>
</html>
